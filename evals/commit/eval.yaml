schema_version: v1alpha1
environment:
  type: none
engine:
  name: codex
  model:
    name: gpt-6-luna
skills:
  - source: local_path
    path: ../skills/commit
    target: .agents/skills/commit
cases:
  files:
    - commit/cases/commit-confirmation.yaml
  parallelism: 1
  retry_policy:
    max_retries: 0
judge:
  type: script
  script_path: script-judge.sh
  timeout_seconds: 30
report:
  formats: [json, html, junit]
  artifacts: [transcript]
