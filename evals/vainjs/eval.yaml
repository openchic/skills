schema_version: v1alpha1
environment:
  type: none
engine:
  name: codex
  model:
    name: gpt-6-luna
skills:
  - source: local_path
    path: ../skills/vainjs
    target: .agents/skills/vainjs
cases:
  files:
    - vainjs/cases/npm-package.yaml
  parallelism: 1
  retry_policy:
    max_retries: 0
judge:
  type: script
  script_path: script-judge.sh
  timeout_seconds: 60
report:
  formats: [json, html, junit]
  artifacts: [transcript]
