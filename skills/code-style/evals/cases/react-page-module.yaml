title: Add a React detail page using the existing route registry
input:
  prompt: |
    Add a user details page alongside the existing user list and register /users/detail in the page registry.
    The details page receives userId as a prop and uses a button to show or hide the ID. Keep the toggle state
    in a hook private to the details page and preserve the user list.
context:
  git:
    init: true
  files:
    package.json: |
      {"name":"react-pages-fixture","private":true,"dependencies":{"react":"^19.0.0"}}
    src/pages/index.ts: |
      import UserList from './UserList'

      export const pages = { '/users': UserList }
    src/pages/UserList/index.tsx: |
      import type { FC } from 'react'

      const UserList: FC = () => <h1>Users</h1>
      UserList.displayName = 'UserList'

      export default UserList
expect:
  exit_code: 0
  files_exist: [src/pages/index.ts, src/pages/UserList/index.tsx]
judge:
  type: agent_judge
  model: gpt-6-luna
  pass_threshold: 1
  criteria:
    - >-
      The existing registry maps /users/detail to the details component. The details page and the list page are sibling
      modules under src/pages/ and /users remains registered. Cite the registry and actual paths.
    - >-
      The details component is an arrow function assigned to a named variable typed as FC<XProps>. The props type
      matches the component name and the component is the default export of its index.tsx. Cite the type and export.
    - >-
      The toggle state lives in the details page's own hooks/ directory. The hook's filename matches its function name,
      and the hook is a named exported function declaration. The details component calls it to control the visibility
      of userId. Inspect the code read-only and cite the call site.
collect_artifacts:
  - 'src/**'
