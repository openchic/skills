id: config-priority
title: Existing project configuration and module contracts
input:
  prompt: |
    users 和 reports 模块各有一份重复的标题标准化函数，请整理成共享实现。
    保留现有 CommonJS 导出、输入处理和输出结果，按已有工程约定组织代码。
    直接修改当前工程，只改任务相关代码；不要安装依赖或更换项目配置。
context:
  repo_fixture: evals/fixtures/config-priority
constraints:
  timeout_seconds: 300
expect:
  exit_code: 0
collect_artifacts:
  - 'src/**'
  - '*.json'
  - '.prettierrc'
