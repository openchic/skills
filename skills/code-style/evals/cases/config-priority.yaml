title: Existing project configuration and module contracts
input:
  prompt: |
    The users and reports modules each have a copy of the title normalization function. Extract a shared implementation.
    Make the changes in the current project and preserve existing behavior.
context:
  repo_fixture: evals/fixtures/config-priority
  git:
    init: true
expect:
  exit_code: 0
  files_exist:
    - src/users.js
    - src/reports.js
    - package.json
    - .prettierrc
  files_not_exist:
    - package-lock.json
    - pnpm-lock.yaml
    - yarn.lock
judges:
  - id: behavior
    type: script
    script_path: evals/checks/config-priority.cjs
  - id: structure
    type: agent_judge
    model: gpt-6-luna
    pass_threshold: 1
    criteria:
      - >-
        Use the workspace diff to verify that package.json and .prettierrc are unchanged and that the
        change includes no dependency installation, project configuration rewrite, or TypeScript migration.
      - >-
        A shared module owns title normalization and both users and reports call it. The change leaves
        no duplicate implementation or unused shared function.
      - >-
        Changes follow the project's formatting configuration, keep file responsibilities clear, and stay
        within the title normalization task. Use read-only commands to inspect the code.
collect_artifacts:
  - 'src/**'
  - '*.json'
  - '.prettierrc'
