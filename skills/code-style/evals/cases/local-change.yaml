title: Keep a local change local when sharing and i18n are unnecessary
input:
  prompt: |
    Update formatReceipt to display amounts with two decimal places. For example, formatReceipt(3) should return Total: $3.00.
    Make the change in the current project.
context:
  git:
    init: true
  files:
    package.json: |
      {"name":"receipt-fixture","private":true,"type":"commonjs"}
    src/receipt.js: |
      /** Format a receipt total. */
      exports.formatReceipt = amount => `Total: $${amount}`
expect:
  exit_code: 0
  files_exist: [src/receipt.js]
judges:
  - id: behavior
    type: script
    script_path: evals/checks/local-change.cjs
  - id: structure
    type: agent_judge
    model: gpt-6-luna
    pass_threshold: 1
    criteria:
      - >-
        The CommonJS export for formatReceipt still works. Amount formatting stays in its only consumer module,
        with no shared utilities, service layer, or files added solely to create directories. Cite the file list and code.
      - >-
        The project has no internationalization system. Verify that the Total string introduces no locale files,
        copy files, or internationalization dependencies and that package.json is unchanged. Inspect artifacts read-only.
collect_artifacts:
  - 'src/**'
  - '*.json'
  - '*.cjs'
