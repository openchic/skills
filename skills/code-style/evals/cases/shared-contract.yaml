title: Extend an existing API contract without changing the response convention
input:
  prompt: |
    Add loadUserOptions(client) to the users module. Return a list of user IDs and names, excluding inactive users.
    Fetch the data with client.get('/users'), export the function publicly, and preserve existing interfaces.
context:
  repo_fixture: evals/fixtures/shared-contract
  git:
    init: true
expect:
  exit_code: 0
  files_exist:
    - src/users.ts
    - src/types.ts
    - src/client.ts
judges:
  - id: behavior
    type: script
    script_path: evals/checks/shared-contract.cjs
  - id: structure
    type: agent_judge
    model: gpt-6-luna
    pass_threshold: 1
    criteria:
      - >-
        The option type for loadUserOptions derives from the existing User type or uses its field types directly.
        Cite the type definition and import site to verify type reuse independently of field names.
      - >-
        The caller uses the data returned by client.get directly, without reading response.data again. The existing
        Client and User contracts are preserved. Cite the relevant code in the call chain.
      - >-
        The agent adds only code needed for the task, with no dependency installation, project configuration changes,
        or unused abstractions. Inspect the artifacts read-only.
collect_artifacts:
  - 'src/**'
  - 'package.json'
