schema_version: v1alpha1
environment:
  type: none
engine:
  name: codex
  model:
    name: gpt-6-luna
cases:
  files:
    - evals/cases/commit-confirmation.yaml
    - evals/cases/commit-cancellation.yaml
  parallelism: 2
  defaults:
    timeout_seconds: 900
    expect:
      exit_code: 0
      file_contains:
        - path: README.md
          content: Titles are trimmed before formatting.
benchmark:
  enabled: false
report:
  formats: [html]
  artifacts: [transcript]
