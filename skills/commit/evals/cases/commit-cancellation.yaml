title: Cancel after preparing a commit without losing user changes
input:
  turns:
    - role: user
      content: |
        在 README.md 末尾追加一行 Titles are trimmed before formatting.，完成这项文档修改即可。
    - role: user
      content: 请为当前修改准备一条提交消息，先让我确认。
    - role: user
      content: 取消，这次不提交了，保留我的修改。
context:
  repo_fixture: evals/fixtures/commit-confirmation
  git:
    init: true
judge:
  type: agent_judge
  model: gpt-6-luna
  pass_threshold: 1
  context:
    profile: minimal
    transcript: file_ref
  criteria:
    - 以用户消息划分 transcript 中的准备和取消阶段。取消前没有任务提交，准备阶段唯一的 Git 操作是 git add -A，回复末行单独给出准确描述 README 改动的 Conventional Commits 消息。
    - 用户取消后停止提交，未执行提交、推送、撤销暂存或文件修改。评审 Agent 可用一次只读 Git 查询核对最新提交及暂存差异，确认仍只有 Skill-Up 的夹具基线提交且 README 改动仍在暂存区。
collect_artifacts:
  - 'README.md'
