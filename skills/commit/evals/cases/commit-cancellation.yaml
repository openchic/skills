title: Cancel after preparing a commit without losing user changes
input:
  turns:
    - role: user
      content: |
        Add the line "Titles are trimmed before formatting." at the end of README.md. That is the only change I need.
    - role: user
      content: Please draft a commit message for the current change and wait for my approval.
    - role: user
      content: Cancel the commit. Keep my changes.
context:
  repo_fixture: evals/fixtures/commit-confirmation
  git:
    init: true
judge:
  type: agent_judge
  model: gpt-6-luna
  pass_threshold: 1
  context:
    profile: minimal
    transcript: file_ref
  criteria:
    - >-
      Use the user messages to distinguish the planning and cancellation phases in the transcript. Before
      cancellation, the working tree and index are preserved and no commit or push occurs. The plan lists
      a Conventional Commits message that accurately describes the change, README.md, and a short summary.
      The agent waits for approval.
    - >-
      After the user cancels, the agent stops without committing, pushing, unstaging, or editing files.
      The judge may inspect Git state with read-only commands to verify that the Skill-Up fixture baseline
      is still the only commit, the index is unchanged, and the README change remains in the working tree.
collect_artifacts:
  - 'README.md'
