title: Extend an existing library without scaffolding it again
input:
  prompt: |
    Add farewell(name) to the existing greeting-kit package. It should return "Goodbye, {name}!"
    Export it from the public entry point and preserve the behavior of greet.
context:
  git:
    init: true
  files:
    package.json: |
      {"name":"greeting-kit","version":"1.0.0","type":"module","exports":"./src/index.js","scripts":{"test":"node --test"}}
    src/index.js: |
      export { greet } from './greet.js'
    src/greet.js: |
      /** Greet a person. */
      export const greet = name => `Hello, ${name}!`
expect:
  exit_code: 0
  files_exist: [package.json, src/index.js, src/greet.js]
judges:
  - id: behavior
    type: script
    script_path: evals/checks/existing-package.cjs
  - id: structure
    type: agent_judge
    model: gpt-6-luna
    pass_threshold: 1
    criteria:
      - >-
        The package name, version, module type, and existing public entry point remain compatible. The agent
        does not scaffold the project again, switch languages, add build or formatting tools, or install
        unrelated dependencies. Cite the diff and command records.
      - >-
        Code changes focus on adding farewell and exporting it. The agent creates no task commits, pushes,
        or releases. Inspect artifacts and command records read-only.
collect_artifacts:
  - 'src/**'
  - '*.json'
  - '*.js'
