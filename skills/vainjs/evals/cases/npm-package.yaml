title: Scaffold a working npm library
input:
  prompt: |
    在当前目录初始化一个名为 greeting-kit 的 npm 库，使用工程规范约定的工具链。
    提供 TypeScript 导出 greet(name: string): string，返回 Hello, {name}!。
    请完成依赖安装并验证构建，同时让发布入口与生成的 JavaScript、类型声明匹配。
    只在当前临时工程操作，不发布、不推送、不创建提交。
context:
  repo_fixture: evals/fixtures/npm-package
  git:
    init: true
expect:
  exit_code: 0
  files_exist:
    - package.json
    - pnpm-lock.yaml
    - tsconfig.json
    - rolldown.config.ts
    - eslint.config.mjs
    - .prettierrc
    - .husky/pre-commit
    - .husky/commit-msg
    - .vscode/settings.json
    - .vscode/extensions.json
    - .github/workflows/publish.yml
judge:
  type: agent_judge
  model: gpt-6-luna
  pass_threshold: 1
  criteria:
    - package.json 的名称为 greeting-kit，使用 ESM、pnpm 和 Rolldown；TypeScript 启用 strict 和 declaration，ESLint 使用 @vainjs/eslint-config，Prettier 使用单引号且无分号；配置 lint-staged、commitlint 和 changelog，依赖使用具体版本范围而非占位符，packageManager 记录实际 pnpm 版本。
    - 根据 transcript 的命令及退出码确认依赖安装和构建成功；只读检查 main、types 和声明的 exports 均指向实际存在的产物，类型声明含 greet 的公开签名。不能凭成功自述判定，也不得由评审补跑安装或构建来修复缺失产物。
    - >-
      由你（评审 Agent）通过 package.json 声明的公开 JavaScript 入口实际 import 并调用 greet，
      验证 greet('World') 为 Hello, World!、greet('') 为 Hello, !、greet('小明') 为 Hello, 小明!。
      引用实际探针命令、返回值和退出码；只查看源码或直接调用 src 下的函数不能证明构建产物可消费。
    - Husky hook 可执行，提交前检查和提交消息校验可用；被测 Agent 没有创建提交、推送或发布，改动仅发生在当前工程。评审 Agent 只读检查 hook 和执行记录。
collect_artifacts:
  - 'src/**'
  - 'dist/**'
  - '.husky/**'
  - '.vscode/**'
  - '.github/**'
  - '*.json'
  - '*.yaml'
  - '*.ts'
  - '*.mjs'
  - '.prettierrc'
  - '.gitignore'
  - 'README.md'
