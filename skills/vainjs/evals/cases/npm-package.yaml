title: Scaffold a working npm library
input:
  prompt: |
    Initialize an npm library named greeting-kit in the current directory using the toolchain specified by the project conventions.
    Export the TypeScript function greet(name: string): string, which returns Hello, {name}!.
    Install dependencies, verify the build, and make sure the published entry points match the generated JavaScript and type declarations.
    Limit changes to this temporary project. Do not publish, push, or create commits.
context:
  repo_fixture: evals/fixtures/npm-package
  git:
    init: true
expect:
  exit_code: 0
  files_exist:
    - package.json
    - pnpm-lock.yaml
    - tsconfig.json
    - rolldown.config.ts
    - eslint.config.mjs
    - .prettierrc
    - .husky/pre-commit
    - .husky/commit-msg
    - .vscode/settings.json
    - .vscode/extensions.json
    - .github/workflows/publish.yml
judge:
  type: agent_judge
  model: gpt-6-luna
  pass_threshold: 1
  criteria:
    - >-
      package.json names the package greeting-kit and the project uses ESM, pnpm, and Rolldown. TypeScript enables
      strict and declaration. ESLint uses @vainjs/eslint-config. Prettier uses single quotes and omits semicolons.
      The project configures lint-staged, commitlint, and the changelog. Dependency ranges specify versions, and
      packageManager records the pnpm version actually used.
    - >-
      Use the transcript commands and exit codes to verify successful installation and build. Use read-only checks
      to confirm that main, types, and the declared exports point to existing artifacts and that the declarations
      contain the public signature of greet. Require execution evidence and leave missing artifacts as found.
    - >-
      As the judge, import and call greet through the public JavaScript entry point declared in package.json.
      Verify that greet('World') returns Hello, World!, greet('') returns Hello, !, and greet('小明') returns Hello, 小明!.
      Cite the actual probe command, return values, and exit code from the built entry point.
    - >-
      Husky hooks are executable, and pre-commit checks and commit message validation work. The agent creates no commits,
      pushes, or releases, and all changes are within the current project. Inspect the hooks and execution records read-only.
collect_artifacts:
  - 'src/**'
  - 'dist/**'
  - '.husky/**'
  - '.vscode/**'
  - '.github/**'
  - '*.json'
  - '*.yaml'
  - '*.ts'
  - '*.mjs'
  - '.prettierrc'
  - '.gitignore'
  - 'README.md'
